name: CI

on:
  push:
    branches:
      - main
    tags:
      - 'cs/v*'
      - 'cpp/v*'
      - 'rust/v*'
      - 'zig/v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect:
    needs: hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      if: github.ref_type != 'tag'
      id: filter
      with:
        filters: |
          cs:
            - 'cs/**'
            - 'test/**'
            - '.github/workflows/**'
          cpp:
            - 'cpp/**'
            - 'test/**'
            - '.github/workflows/**'
          rust:
            - 'rust/**'
            - 'test/**'
            - '.github/workflows/**'
          zig:
            - 'zig/**'
            - 'test/**'
            - '.github/workflows/**'
    - id: matrix
      shell: pwsh
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
        EVENT_NAME: ${{ github.event_name }}
        CHANGES: ${{ steps.filter.outputs.changes }}
      run: |
        $all = @(
          @{component='cs'; display='C#'; setup='dotnet'}
          @{component='cpp'; display='C++'; setup='zig'}
          @{component='rust'; display='Rust'; setup='rust'}
          @{component='zig'; display='Zig'; setup='zig'}
        )
        if ($env:REF_TYPE -eq 'tag') {
          $tag = $env:REF_NAME
          $c = $all | Where-Object { $tag -like "$($_.component)/v*" }
          if (-not $c) { throw "Unsupported tag: $tag" }
          $ver = $tag -replace '^[^/]+/v?', ''
          if ($ver -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid tag: $tag" }
          $filtered = $c | ForEach-Object { $_ | Select-Object *, @{N='version';E={$ver}} }
        } elseif ($env:EVENT_NAME -eq 'workflow_dispatch') {
          $filtered = $all
        } else {
          $changes = $env:CHANGES | ConvertFrom-Json
          $filtered = $all | Where-Object { $changes -contains $_.component }
        }
        if (-not $filtered) { $filtered = @() }
        echo "value=$($filtered | ConvertTo-Json -Compress -AsArray)" >> $env:GITHUB_OUTPUT

  # Always runs: a docs-only change yields an empty lane matrix and must still be checked.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check whitespace hygiene
      shell: pwsh
      run: |
        $binaryExts = @('.exe', '.dll', '.png', '.ico', '.zip', '.sha256', '.sha512')
        $bad = @()
        $files = git -c core.quotepath=off ls-files -z | ForEach-Object { $_ -split "`0" } | Where-Object { $_ }
        foreach ($f in $files) {
          if ($binaryExts -contains [System.IO.Path]::GetExtension($f).ToLowerInvariant()) { continue }
          $b = [System.IO.File]::ReadAllBytes((Join-Path $PWD $f))
          if ($b.Length -eq 0) { continue }
          if ($b[-1] -ne 0x0A) { $bad += "$f (no final newline)"; continue }
          $text = [System.Text.Encoding]::UTF8.GetString($b)
          if ($text -match '(?m)[ \t]+\r?$') { $bad += "$f (trailing whitespace)" }
        }
        if ($bad) { throw "Whitespace issues: $($bad -join '; ')" }
        Write-Host "All tracked files pass whitespace checks."

    - name: Check encoding hygiene
      shell: pwsh
      run: |
        $binaryExts = @('.exe', '.dll', '.png', '.ico', '.zip', '.sha256', '.sha512')
        $bad = @()
        $files = git -c core.quotepath=off ls-files -z | ForEach-Object { $_ -split "`0" } | Where-Object { $_ }
        foreach ($f in $files) {
          if ($binaryExts -contains [System.IO.Path]::GetExtension($f).ToLowerInvariant()) { continue }
          $b = [System.IO.File]::ReadAllBytes((Join-Path $PWD $f))
          if ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF) { $bad += "$f (UTF-8 BOM)" }
        }
        if ($bad) { throw "Encoding issues: $($bad -join '; ')" }
        Write-Host "All tracked files pass encoding checks."

  # Only Zig builds the probe, and the cs and rust jobs install no Zig, so it is built
  # once here and handed to every lane. detect is a dependency only so the condition below can read it.
  probe:
    needs: [detect, hygiene]
    if: needs.detect.outputs.matrix != '' && needs.detect.outputs.matrix != '[]'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup Zig
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      with:
        version: 0.17.0
    - name: Build the test probe
      shell: pwsh
      run: .\test\build-probe.ps1
    - name: Upload the probe
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: probe
        path: test/probe.exe
        if-no-files-found: error

  build:
    needs: [detect, hygiene, probe]
    if: needs.detect.outputs.matrix != '' && needs.detect.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-tags: true
    - name: Setup .NET
      if: matrix.setup == 'dotnet'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
    - name: Setup Zig
      if: matrix.setup == 'zig'
      uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
      with:
        version: 0.17.0
    - name: Setup Rust
      if: matrix.setup == 'rust'
      uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      with:
        targets: aarch64-pc-windows-msvc
    - name: Fetch the shared probe
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: probe
        path: test
    - name: Check ${{ matrix.component }} formatting
      shell: pwsh
      run: |
        switch ('${{ matrix.component }}') {
          'cpp'  { clang-format --dry-run --Werror cpp/shim.cpp }
          'rust' { Push-Location rust; cargo fmt --check; Pop-Location }
          'zig'  { Push-Location zig; zig fmt --check shim.zig; Pop-Location }
          'cs'   { dotnet format cs/shim.csproj --verify-no-changes }
        }
    - name: Build ${{ matrix.component }}
      shell: pwsh
      run: .\${{ matrix.component }}\build.ps1
    - name: Test ${{ matrix.component }} (x86)
      shell: pwsh
      run: .\test\run-tests.ps1 -ShimExe ".\${{ matrix.component }}\bin\x86\shim.exe"
    - name: Test ${{ matrix.component }} (x64)
      shell: pwsh
      run: .\test\run-tests.ps1 -ShimExe ".\${{ matrix.component }}\bin\x64\shim.exe"
    - name: Stage release packages
      if: github.ref_type == 'tag'
      shell: pwsh
      run: |
        $dist = "${{ matrix.component }}\dist"
        Remove-Item $dist -Recurse -Force -ErrorAction SilentlyContinue
        New-Item $dist -ItemType Directory -Force | Out-Null
        # Compress-Archive stamps the wall clock into every entry, so the same build packed twice hashes differently; entries carry the version file's last change instead.
        $stamp = [datetimeoffset]::Parse((git log -1 --format=%cI -- "${{ matrix.component }}/version").Trim())
        Add-Type -AssemblyName System.IO.Compression.FileSystem
        foreach ($t in @('x86','x64','arm64')) {
          $entries = @{ 'shim.exe' = "${{ matrix.component }}\bin\$t\shim.exe"; 'version' = "${{ matrix.component }}\version" }
          $zip = [System.IO.Compression.ZipFile]::Open("$dist\shim-$t.zip", 'Create')
          foreach ($name in 'shim.exe', 'version') {
              $e = $zip.CreateEntry($name, [System.IO.Compression.CompressionLevel]::Optimal)
              $e.LastWriteTime = $stamp
              $in = [System.IO.File]::OpenRead($entries[$name])
              $out = $e.Open()
              $in.CopyTo($out)
              $out.Dispose()
              $in.Dispose()
          }
          $zip.Dispose()
        }
    - name: Upload release artifacts
      if: github.ref_type == 'tag'
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: release-${{ matrix.component }}
        path: ${{ matrix.component }}/dist/*.zip
        if-no-files-found: error

  # Tag-gated release: the only job that needs an elevated token.
  release:
    needs: [detect, build]
    if: github.ref_type == 'tag' && needs.detect.outputs.matrix != '' && needs.detect.outputs.matrix != '[]'
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-tags: true
    - name: Preflight VT_API_KEY
      shell: pwsh
      env:
        VT_API_KEY: ${{ secrets.VT_API_KEY }}
      run: |
        if (-not $env:VT_API_KEY) {
          throw "Missing required secret VT_API_KEY; set it in repository secrets before tagging a release."
        }
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: release-${{ matrix.component }}
        path: ${{ matrix.component }}/dist
    - name: Resolve fromTag
      id: fromtag
      shell: pwsh
      env:
        COMPONENT: ${{ matrix.component }}
        VERSION: ${{ matrix.version }}
      run: |
        $tags = git tag --list "$env:COMPONENT/v*" | ForEach-Object { $_ -replace '^[^/]+/v', '' } | Where-Object { $_ -match '^\d+\.\d+\.\d+$' }
        $ver = $env:VERSION
        $sorted = @($tags | Sort-Object { [version]$_ })
        $i = [array]::IndexOf($sorted, $ver)
        if ($i -lt 1) {
          throw "Cannot resolve previous release tag for $env:COMPONENT v$ver (known release tags: $($sorted -join ', '))"
        }
        $prev = "$env:COMPONENT/v$($sorted[$i-1])"
        echo "tag=$prev" >> $env:GITHUB_OUTPUT
    - name: Build Changelog
      id: changelog
      uses: mikepenz/release-changelog-builder-action@aa013739bbc8e7067dbbecd4525ff11aeb51a84b # v6.4.0
      with:
        mode: "HYBRID"
        fromTag: ${{ steps.fromtag.outputs.tag }}
        configurationJson: >
          {
            "tag_resolver": {
              "method": "semver",
              "transformer": { "pattern": "${{ matrix.component }}/v(.+)", "target": "$1" }
            },
            "template": "#{{CHANGELOG}}",
            "empty_template": "",
            "categories": [
              { "title": "## 🚀 Features", "labels": ["feat"] },
              { "title": "## 🐛 Fixes", "labels": ["fix"] },
              { "title": "## ⚡ Performance", "labels": ["perf"] },
              { "title": "## ♻️ Refactoring", "labels": ["refactor", "style"] },
              { "title": "## 📝 Documentation", "labels": ["docs"] },
              { "title": "## 🔧 Maintenance", "labels": ["build", "ci", "chore"] },
              { "title": "## 🧪 Testing", "labels": ["test"] },
              { "title": "## Other", "labels": [] }
            ],
            "label_extractor": [
              {
                "pattern": "^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\\([^)]*\\))?(!)?: .+",
                "on_property": "title",
                "target": "$1"
              }
            ],
            "commit_template": "- #{{TITLE}} (thanks @#{{AUTHOR}})"
          }
        includeOnlyPaths: |
          ${{ matrix.component }}/
        token: ${{ secrets.GITHUB_TOKEN }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    - name: Release
      id: release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: ${{ matrix.component }}/dist/*.zip
        name: ${{ matrix.display }} Shim v${{ matrix.version }}
        body: ${{ steps.changelog.outputs.changelog }}
        fail_on_unmatched_files: true
    - name: Attest build provenance
      uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
      with:
        subject-path: '${{ matrix.component }}/dist/shim-*.zip'
    - name: VirusTotal Scan
      shell: pwsh
      env:
        VT_API_KEY: ${{ secrets.VT_API_KEY }}
        GH_TOKEN: ${{ github.token }}
        VT_TAG: ${{ github.ref_name }}
        VT_DIST: ${{ matrix.component }}/dist
      run: |
        try {
          # The public API tier allows four requests per minute; every call is spaced 15 s.
          $headers = @{ 'x-apikey' = $env:VT_API_KEY }
          $results = @()
          foreach ($zip in Get-ChildItem "$env:VT_DIST/*.zip" | Sort-Object Name) {
            Start-Sleep -Seconds 15
            $r = Invoke-RestMethod -Method Post -Uri 'https://www.virustotal.com/api/v3/files' -Headers $headers -Form @{ file = $zip }
            $results += [pscustomobject]@{
              name = $zip.Name
              id = $r.data.id
              link = "https://www.virustotal.com/gui/file-analysis/$($r.data.id)"
              stats = $null
            }
          }
          # A queued analysis reports empty stats, so the counts are only read once completed.
          $deadline = (Get-Date).AddMinutes(6)
          $pending = @($results)
          while ($pending.Count -gt 0 -and (Get-Date) -lt $deadline) {
            foreach ($f in @($pending)) {
              Start-Sleep -Seconds 15
              $r = Invoke-RestMethod -Method Get -Uri "https://www.virustotal.com/api/v3/analyses/$($f.id)" -Headers $headers
              if ($r.data.attributes.status -eq 'completed') {
                $f.stats = $r.data.attributes.stats
                $pending = @($pending | Where-Object { $_.name -ne $f.name })
              }
            }
          }
          if ($pending.Count -gt 0) {
            Write-Warning "Analysis incomplete after the deadline, links left without counts: $($pending.name -join ', ')"
          }
          # The visible line carries the counts; the collapsed list carries the links.
          $lines = foreach ($f in $results) { "- [$($f.name)]($($f.link))" }
          $segments = foreach ($f in $results) {
            $arch = $f.name -replace '^shim-', '' -replace '\.zip$', ''
            if ($f.stats) {
              $s = $f.stats
              $det = [int]$s.malicious + [int]$s.suspicious
              $tot = $det + [int]$s.undetected + [int]$s.harmless
              "$det/$tot for $arch"
            } else {
              "pending for $arch"
            }
          }
          $summary = "$($results.Count) files scanned: $($segments -join ', ') (at release)"
          # GitHub renders markdown inside <details> only with blank lines around the list.
          $section = "## 🛡️ VirusTotal Scan`n`n- $summary.`n`n<details><summary>Scan results</summary>`n`n$($lines -join "`n")`n`n</details>"
          $body = (gh release view $env:VT_TAG --json body -q .body) -join "`n"
          $tmp = Join-Path $env:RUNNER_TEMP 'release-body.md'
          $new = if ($body) { "$($body.TrimEnd())`n`n$section`n" } else { "$section`n" }
          $new | Set-Content -LiteralPath $tmp -NoNewline
          gh release edit $env:VT_TAG --notes-file $tmp
        } catch {
          # The scan annotates the release: a failure here must not fail it, the zips are already published.
          Write-Warning "VirusTotal section failed: $_"
        }
